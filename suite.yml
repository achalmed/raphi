# suite.yml — suite raphi: PDF, ofimática y conversión de archivos (motor, CLI, web y escritorio; antes DocFlow Studio).
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: raphi
objetivo: documentos
resumen: PDF, ofimática y conversión de archivos (motor, CLI, web y escritorio; antes DocFlow Studio).
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.py                  # la aplicación (o raphi, el lanzador de install.sh; o ./run.sh): Raphi Studio con el Python del sistema, el motor con el .venv
- raphi lista              # las operaciones del motor
- raphi doctor             # lo que falta en esta máquina
- 'raphi comprimir a.pdf --hasta 10 -n   # una operación (simulada)'
- raphi receta para-enviar a.pdf
- python3 -m pytest -q tests
- tests/run.sh             # Raphi Studio (QML) sobre archivos de muestra
estado: activo
interfaz: gui
depende_de:
- PySide6 (el del sistema para Raphi Studio: python3-pyside6.* con Kirigami y QtMultimedia de QML, y gui-comun 3.0; el del .venv para la ventana web)
- pikepdf
- PyMuPDF
nota: motor y CLI en raphi/ (python -m raphi); la web en web/ y la ventana en escritorio/ (la misma interfaz); docflow, en backends/docflow (pdf-suite y page-counter se retiraron en R8)
