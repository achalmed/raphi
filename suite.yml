# suite.yml — suite raphi: Raphi escritorio (PySide6; antes DocFlow Studio) sobre docflow, pdf-suite y page-counter.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: raphi
objetivo: documentos
resumen: Raphi escritorio (PySide6; antes DocFlow Studio) sobre docflow, pdf-suite y page-counter.
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.py                  # la aplicación (o raphi, el lanzador de install.sh; o ./run.sh)
- raphi lista              # las operaciones del motor
- raphi doctor             # lo que falta en esta máquina
- 'raphi comprimir a.pdf --hasta 10 -n   # una operación (simulada)'
- raphi receta para-enviar a.pdf
- python3 -m pytest -q tests
estado: activo
interfaz: gui
depende_de:
- PySide6
- pikepdf
- PyMuPDF
nota: motor y CLI en raphi/ (python -m raphi); la web en web/ y la ventana en escritorio/ (la misma interfaz); backends docflow, pdf-suite y page-counter en backends/
