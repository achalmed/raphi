# suite.yml — suite raphi: Raphi escritorio (PySide6; antes DocFlow Studio) sobre docflow, pdf-suite y page-counter.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: raphi
objetivo: documentos
resumen: Raphi escritorio (PySide6; antes DocFlow Studio) sobre docflow, pdf-suite y page-counter.
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.py
- './run.sh                 # usa el .venv si existe'
- python3 -m studio
- raphi                    # lanzador que instala install.sh
estado: activo
interfaz: gui
depende_de:
- PySide6
nota: config en studio/core/settings.py (QSettings); backends docflow, pdf-suite y page-counter en backends/
