# backends/page-counter/suite.yml — suite page_counter: Cuenta las páginas de los index.pdf generados por cada blog (APA) y produce un reporte por blog.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: page_counter
objetivo: documentos
resumen: Cuenta las páginas de los index.pdf generados por cada blog (APA) y produce un reporte por blog.
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.py
- main.py -b <blog> [<blog> ...]
estado: activo
entrada: web/_site y _pubs/*/_site
depende_de:
- python3
- pypdf
nota: cada corrida escribe su reporte Excel en excel_databases/ de la propia suite (-o le da nombre); no escribe fuera de su carpeta.
