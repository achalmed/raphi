# suite.yml — contrato de la suite (esquema en core/suite.schema.yml); core/suites.py generar escribe los índices y READMEs.
nombre: photo_metadata_suite
objetivo: multimedia
resumen: Renombra e incrusta fechas en fotos de cámaras (Tapo y similares) a partir de la marca de tiempo; audita y sincroniza con digiKam.
escribe_en:
- archivos
simula_por_defecto: true
comandos:
- main.py analyze <carpeta>
- main.py apply <carpeta> --execute
- main.py verify <carpeta>
- main.py undo <carpeta> --execute
estado: activo
depende_de:
- exiftool
- python3
