# scripts_photo_metadata_suite/suite.yml — suite photo_metadata_suite: Renombra e incrusta fechas en fotos de cámaras (Tapo y similares) a partir de la marca de tiempo; audita y sincroniza con digiKam.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: photo_metadata_suite
objetivo: multimedia
resumen: Renombra e incrusta fechas en fotos de cámaras (Tapo y similares) a partir de la marca de tiempo; audita y sincroniza con digiKam.
escribe_en:
- archivos
simula_por_defecto: true
comandos:
- main.py analyze|verify <carpeta>
- main.py apply <carpeta> [--execute] [--from-plan plan.csv]
- main.py undo <carpeta> [--execute]
- main.py audit-dates <carpeta> [--year AAAA]
- main.py fix-names|embed-date <carpeta> [--execute]
- main.py sync-digikam <carpeta> [--execute]
estado: activo
depende_de:
- exiftool
- python3 (Pillow, numpy)
- tesseract
- ffmpeg
