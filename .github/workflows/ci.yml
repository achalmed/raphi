# CI de docflow: lint (shellcheck) + suite Bats en Ubuntu y Arch Linux.
name: CI

on:
  push:
    paths: ["backends/docflow/**"]
  pull_request:
    paths: ["backends/docflow/**"]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y shellcheck
          shellcheck -x -S warning \
            backends/docflow/bin/docflow backends/docflow/install.sh \
            backends/docflow/lib/{core,engines,formats,commands}/*.sh

  test-ubuntu:
    name: Bats (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats pandoc libreoffice qpdf ghostscript poppler-utils python3
      - name: Ejecutar suite
        run: bats backends/docflow/tests/

  test-arch:
    name: Bats (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Instalar dependencias
        run: pacman -Syu --noconfirm bash bats pandoc-cli libreoffice-still qpdf ghostscript poppler python git
      - uses: actions/checkout@v5
      - name: Ejecutar suite
        run: bats backends/docflow/tests/
