# Lo que llega escaneado a una mesa de partes: buscable, liviano, de archivo y foliado.
nombre: Escaneo de mesa de partes
descripcion: OCR en español con enderezado, compresión hasta 10 MB, PDF/A-2b y foliación.
pasos:
  - operacion: ocr
    params: {idioma: spa, enderezar: true}
  - operacion: comprimir
    params: {hasta: 10, umbral: 0}
  - operacion: pdfa
  - operacion: foliar
