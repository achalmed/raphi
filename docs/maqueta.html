<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta — Raphi Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Variables de respaldo: imitan las del anfitrión donde se mostró la maqueta. */
:root{color-scheme:light;
--bg-primary:#ffffff;--surface-1:#f4f3ef;--surface-2:#ffffff;
--text-primary:#1c1c1e;--text-secondary:#6b6b66;--text-muted:#8e8e88;
--text-accent:#2563eb;--text-success:#15803d;--text-warning:#b45309;--text-danger:#b91c1c;
--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.24);--border-accent:#2563eb;--border-danger:#dc2626;--border-warning:#d97706;
--bg-accent:#dbe7fd;--bg-accent-muted:#eef3fe;--bg-success:#dcfce7;--bg-warning:#fef3c7;--bg-danger:#fee2e2;
--fill-accent:#2563eb;--fill-success:#16a34a;--fill-warning:#d97706;--fill-danger:#dc2626;--fill-ghost-selected:rgba(0,0,0,.06);
--on-accent:#ffffff;--radius:8px;
--font-sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--font-voice:Georgia,"Source Serif 4",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg-primary:#1c1c1e;--surface-1:#242426;--surface-2:#2c2c2e;
--text-primary:#f5f5f0;--text-secondary:#a0a09a;--text-muted:#7c7c76;
--text-accent:#7aa7ff;--text-success:#4ade80;--text-warning:#fbbf24;--text-danger:#f87171;
--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.24);--border-accent:#7aa7ff;
--bg-accent:#1e3a6e;--bg-accent-muted:#1a2740;--bg-success:#14532d;--bg-warning:#4a3410;--bg-danger:#4c1d1d;
--fill-ghost-selected:rgba(255,255,255,.08)}}
body{margin:0;padding:24px 16px;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5}
main{max-width:1100px;margin:0 auto}
.encabezado{margin:0 0 14px}.encabezado h1{font-size:18px;font-weight:600;margin:0}
.encabezado p{margin:4px 0 0;color:var(--text-secondary);font-size:12px}
button{font:inherit;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<style>
/* La metáfora de Raphi Studio: Un taller: la zona donde se sueltan los archivos, la paleta de herramientas por área y la cola con su avance en violeta. Acento propio #7c3aed; en la app el color sale del tema de KDE. */
.nota-maqueta{color:var(--text-secondary);font-size:13px;margin:0 0 12px;max-width:820px}
.win{border:0.5px solid var(--border);border-radius:12px;overflow:hidden;font-size:12px;background:var(--surface-2);box-shadow:0 8px 30px rgb(0 0 0 / .10)}
.tit{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:0.5px solid var(--border);background:var(--surface-1)}
.mut{color:var(--text-secondary);font-size:11px}
.row{display:flex;align-items:center;gap:6px}
.btn{font-size:11px;padding:3px 9px}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
</style>
</head>
<body>
<main>
<header class="encabezado"><h1>Maqueta — Raphi Studio</h1>
<p>Aprobada el 2026-11-18 (versión «identidad propia»).</p></header>
<p class="nota-maqueta">Un taller: la zona donde se sueltan los archivos, la paleta de herramientas por área y la cola con su avance en violeta.</p>
<div id="vista" aria-label="Ventana de Raphi Studio"></div>
</main>
<script>
const A={"raphi": "#7c3aed"};
const el=id=>document.getElementById(id);
const tb=(c,t,extra)=>`<div class="tit"><i class="ti ${t[0]}" style="color:${c};font-size:15px" aria-hidden="true"></i><span style="font-weight:500">${t[1]}</span>${extra||""}</div>`;
const vista=c=>`<div class="win">${tb(c,["ti-file-stack","Raphi"],`<span class="mut">86 herramientas</span><span style="flex:1"></span><button class="btn">Simular</button><button class="btn" style="background:${c};color:#fff;border-color:${c}">Procesar…</button>`)}
<div style="padding:10px"><div style="border:1.5px dashed ${c};border-radius:10px;padding:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><i class="ti ti-download" style="color:${c};font-size:18px" aria-hidden="true"></i><span class="mut">Suelta aquí archivos o carpetas</span>${["informe-escaneado.pdf","programa-sabado.mp3","fotos-noviembre/"].map(f=>`<span style="border:0.5px solid var(--border-strong);border-radius:6px;padding:2px 8px">${f}</span>`).join("")}</div></div>
<div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
<div style="padding:0 10px 10px">${[["PDF",["ti-file-type-pdf","OCR"],["ti-arrows-join","Unir"],["ti-cut","Partir"],["ti-file-zip","Comprimir"]],["Audio y video",["ti-language","Transcribir"],["ti-download","Descargar"],["ti-movie","Convertir"],["ti-scissors","Recortar"]],["Imagen",["ti-calendar","Fecha EXIF"],["ti-photo","Convertir"],["ti-crop","Recortar"],["ti-resize","Tamaño"]]].map(a=>`<div class="mut" style="margin:6px 0 4px">${a[0]}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${a.slice(1).map(t=>`<div style="border:0.5px solid var(--border);border-radius:8px;padding:6px;text-align:center"><i class="ti ${t[0]}" style="font-size:18px;color:${c}" aria-hidden="true"></i><div>${t[1]}</div></div>`).join("")}</div>`).join("")}</div>
<div style="padding:0 10px 10px;border-left:0.5px solid var(--border)"><div style="font-weight:500;margin:6px 0">Cola</div>${[["programa-sabado.mp3","Transcribir",42],["informe-escaneado.pdf","OCR",0],["fotos-noviembre/","Fecha EXIF",100]].map(q=>`<div style="margin-bottom:8px"><div class="row"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${q[0]}</span><span class="mut">${q[2]===100?"listo":q[2]?q[2]+" %":"en espera"}</span></div><div class="mut">${q[1]}</div><div style="height:4px;background:var(--surface-1);border-radius:2px"><div style="height:4px;width:${q[2]}%;background:${c};border-radius:2px"></div></div></div>`).join("")}</div></div></div>`;
el("vista").innerHTML=vista("#7c3aed");
</script>
</body>
</html>
